-renamesourcefileattribute SourceFile
-keepattributes SourceFile,LineNumberTable
-optimizations !code/allocation/variable
-optimizationpasses 5

-allowaccessmodification
-dontskipnonpubliclibraryclassmembers

# Keep our own classes and members. They are all used.
# Without this, methods only used in tests are removed and break tests.
-keep class !de.danoeh.antennapod.**R$**,!de.danoeh.antennapod.**R,de.danoeh.antennapod**
-keepclassmembers class !de.danoeh.antennapod.**R$**,!de.danoeh.antennapod.**R,de.danoeh.antennapod** {*;}

# Instrumented tests reference the app's own R class, which is not inlined
# because resource IDs are not final. The R classes of the library modules
# are just copies of it and are not referenced at runtime.
-keep class de.danoeh.antennapod.R$* {*;}

# Instrumented tests call library methods that the app itself never calls.
# R8 only sees the app, so it would remove or inline them.
-keepclassmembers class org.apache.commons.lang3.** {
    public static *;
}
-keepclassmembers class org.apache.commons.io.** {
    public static *;
}
-keepclassmembers class androidx.appcompat.app.ActionBar {
    public ** getTitle();
}
-keepclassmembers class androidx.preference.PreferenceManager {
    public static *;
}
-keepclassmembers class androidx.drawerlayout.widget.** {
    *;
}
-keepclassmembers class androidx.tracing.Trace {
    public static *;
}

# Room instantiates the generated implementation reflectively.
# The rule that Room ships keeps the class but not its constructor.
-keep class * extends androidx.room.RoomDatabase {
    <init>();
}

# Keep stack traces of libraries readable
-keep,allowshrinking,allowoptimization class * {
    public *;
    protected *;
}

-keepattributes Signature
-keepattributes Exceptions

# Instrumented tests reflect on these media3 session types, which the app code itself never references
-keep class androidx.media3.session.MediaBrowser* { *; }

# Instrumented tests drive WorkManager directly and the work-testing library reaches
# into its internals, while the app code never calls most of that API surface
-keep class androidx.work.** { *; }
-keep class kotlinx.coroutines.** { *; }
-keep public class okhttp3.** { public *; }

# The test APK calls these app classes directly even though the app code itself
# never uses the same members, so R8 would strip them from the release build
-keep class androidx.concurrent.futures.CallbackToFutureAdapter { *; }
-keep class androidx.concurrent.futures.CallbackToFutureAdapter$Completer { *; }
-keep class androidx.concurrent.futures.CallbackToFutureAdapter$Resolver { *; }
-keep class androidx.concurrent.futures.ResolvableFuture { *; }
-keep class androidx.drawerlayout.widget.DrawerLayout { *; }
-keep class androidx.drawerlayout.widget.DrawerLayout$DrawerListener { *; }
-keep class androidx.drawerlayout.widget.DrawerLayout$SimpleDrawerListener { *; }
-keep class androidx.lifecycle.Lifecycle$State { *; }
-keep class androidx.media3.common.MediaItem { *; }
-keep class androidx.media3.common.MediaItem$Builder { *; }
-keep class androidx.media3.common.MediaItem$RequestMetadata { *; }
-keep class androidx.media3.common.MediaMetadata { *; }
-keep class androidx.media3.common.PlaybackParameters { *; }
