name: Coverage

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  unit-coverage:
    name: "Unit and integration test coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Unit tests
        run: ./gradlew testPlayDebugUnitTest testDebugUnitTest -Pcoverage -PcoverageSuite=unit -PtestGroup=unit
      - name: Integration tests
        run: ./gradlew testPlayDebugUnitTest testDebugUnitTest -Pcoverage -PcoverageSuite=integration -PtestGroup=integration
      - name: Pack coverage data
        run: find . -path '*/build/coverage/*' -name '*.exec' | tar czf coverage-unit.tgz -T -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-unit
          path: coverage-unit.tgz

  e2e-coverage:
    name: "Emulator test coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Remove unused packages to save space
        run: sudo apt-get remove firefox google-chrome-stable microsoft-edge-stable snapd powershell azure-cli llvm-16 llvm-17 llvm-18 llvm-16-dev llvm-17-dev llvm-18-dev
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Build with Gradle
        run: ./gradlew assemblePlayDebugAndroidTest -PtestBuildType=debug -Pcoverage
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Emulator test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          channel: canary
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/workflows/runEmulatorTests.sh debug -Pcoverage
      - name: Pack coverage data
        run: find . -path '*/build/outputs/code_coverage/*' -name '*.ec' | tar czf coverage-e2e.tgz -T -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-e2e
          path: coverage-e2e.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: coverage-test-report
          path: app/build/reports/androidTests/

  coverage-report:
    name: "Coverage report"
    needs:
      - unit-coverage
      - e2e-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Unpack coverage data
        run: |
          tar xzf coverage-unit.tgz
          tar xzf coverage-e2e.tgz
      - name: Compile classes
        run: ./gradlew compilePlayDebugJavaWithJavac compileDebugJavaWithJavac
      - name: Report
        run: |
          ./gradlew coverageReport -PcoverageSuite=unit
          ./gradlew coverageReport -PcoverageSuite=integration
          ./gradlew coverageReport -PcoverageSuite=e2e
          ./gradlew coverageReport
          cat build/reports/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: build/reports/coverage/
